  {id:1,  task:"Fill out Chuck's Final Guest Count form, Part 1 (count, meals, vendors, bar)", category:"This weekend", due:"2026-10-11", note:"Filled with 154 (143 Dual, 1 Veg, 1 Vegan, 5 GF, 3 Kids, 1 Dairy Free). Tables go in Parts 2-3 once final.", done:true},

<style>
:root{--sun:#f59e42;--sunset:#e8673c;--coral:#f28b6d;--sand:#f3e3c3;--cream:#fffaf0;--teal:#1f8a8a;--deep:#0f5257;--ink:#2d2a26;--muted:#7a736a}
*{box-sizing:border-box}
body{margin:0;font-family:"EB Garamond",Garamond,Georgia,serif;font-size:18px;color:var(--ink);background:var(--cream);line-height:1.4;-webkit-text-size-adjust:100%;font-variant-numeric:lining-nums}
button{font-family:inherit}
header{position:relative;overflow:hidden;background:linear-gradient(180deg,#ffd9a0 0%,#ffc58a 40%,#f8a873 64%,#7cc6c0 65%,#4fa9a6 100%);padding:26px 16px 64px;text-align:center}
header .sun{position:absolute;top:12px;right:5%;width:100px;height:100px}
header .palm{position:absolute;bottom:0;left:2%;width:110px;height:185px}
header .waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:36px;display:block}
.htext{position:relative;z-index:2}
h1{font-weight:600;font-size:clamp(18px,5.6vw,54px);line-height:1.1;letter-spacing:.005em;white-space:nowrap;margin:0 0 6px;color:var(--deep);text-shadow:0 1px 0 rgba(255,255,255,.55)}
.sub{font-size:clamp(15px,2.4vw,19px);font-style:italic;color:#5a3b22;margin:0}
.sub a{color:var(--deep);font-style:normal;font-weight:600;text-decoration:none;white-space:nowrap}
.sub b{color:var(--sunset);font-style:normal;font-weight:600;white-space:nowrap}
main{max-width:740px;margin:-26px auto 0;padding:0 14px 24px;position:relative;z-index:3}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(15,82,87,.10);padding:12px 18px 14px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;color:var(--deep);margin-bottom:7px;font-size:18px}
.prog-top span:last-child{color:var(--muted);font-weight:500}
.bar{height:9px;background:var(--sand);border-radius:999px;overflow:hidden}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--sunset));border-radius:999px;transition:width .4s}
.filters{display:flex;flex-wrap:wrap;gap:7px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;font-size:16px;font-weight:500;border:1px solid #e2d3b5;background:#fff;color:var(--ink);padding:3px 13px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--deep);border-color:var(--deep);color:#fff}
.group{margin-top:16px}
.ghead{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin:0 0 7px 4px}
.ghead::after{content:"";flex:1;height:1px;background:#e8dcc4}
.ghead.hot{color:var(--sunset)}
.item{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:11px 14px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-left:4px solid transparent;transition:opacity .2s}
.item.soon{border-left-color:var(--sun);background:#fff6e8}
.item.overdue{border-left-color:#d64545;background:#fff0ec}
.item.done{opacity:.5;background:#fff;border-left-color:transparent}
.item.done .t{text-decoration:line-through}
.item input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:22px;height:22px;margin:2px 0 0;border:2px solid var(--teal);border-radius:6px;cursor:pointer;display:grid;place-items:center;background:#fff}
.item input:checked{background:var(--teal)}
.item input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0}
.t{font-weight:500;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px;font-size:15px}
.pill{padding:0 9px;border-radius:999px;font-weight:600;font-size:13.5px;line-height:1.55;color:#fff;white-space:nowrap}
.flag{font-weight:600;color:var(--sunset);font-style:italic}
.overdue .flag{color:#c23a3a}
.note{margin-top:4px;font-size:16px;color:#5b554e;overflow-wrap:anywhere}
.note a,.lnk{color:var(--teal);font-weight:600}
.lnk{display:inline-block;margin-top:5px;font-size:16px}
footer{text-align:center;font-size:15px;color:var(--muted);padding:6px 16px 30px;line-height:1.6}
footer button{font-size:15px;background:none;border:none;padding:0;color:var(--teal);text-decoration:underline;cursor:pointer}
.seatsec{max-width:1400px;margin:14px auto 0;padding:0 14px 8px;scroll-margin-top:10px}
.seathead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 4px 8px}
.seathead h2{font-weight:600;font-size:30px;color:var(--deep);margin:0}
.seathead a{color:var(--teal);font-weight:600;font-size:16px}
.seatframe{display:block;width:100%;height:85vh;min-height:560px;border:0;border-radius:16px;background:var(--cream);box-shadow:0 4px 18px rgba(15,82,87,.10)}
@media (max-width:560px){
 header{padding:20px 8px 56px}
 header .sun{width:70px;height:70px;top:-18px;right:-18px}
 header .palm{width:64px;height:108px;left:-8px}
 .filters{flex-wrap:nowrap}
 .sub{padding:0 30px}
 .seatframe{height:90vh}.seathead h2{font-size:25px}
}
/* drag-to-reschedule */
.hint{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:15px;font-style:italic;color:var(--muted);margin:4px 4px 0}
.movedbtn{font-size:14.5px;font-weight:600;font-style:normal;border:1px solid var(--coral);background:#fff;color:var(--sunset);padding:1px 11px;border-radius:999px;cursor:pointer}
.group[data-day]{border-radius:14px;transition:background .15s,box-shadow .15s}
.group.over{background:rgba(245,158,66,.16);box-shadow:0 0 0 2px var(--sun)}
.group.over .ghead{color:var(--sunset)}
.group.emptyday{margin-top:8px}
.group.emptyday .ghead{margin-bottom:3px;opacity:.75}
.dz{border:1px dashed #e6d4b0;border-radius:12px;padding:3px 12px;font-size:15px;font-style:italic;color:#b59c72;text-align:center}
.group.wed .ghead{color:var(--sunset)}
.grip{flex:0 0 auto;align-self:stretch;display:flex;align-items:center;justify-content:center;width:26px;margin:-11px -4px -11px -12px;padding-left:2px;color:#b89c6c;font-size:16px;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:10px 0 0 10px}
.grip:hover{color:var(--sun);background:rgba(245,158,66,.08)}
@media (pointer:fine){.item{cursor:grab}.item .body{cursor:auto}}
.item.dragsrc{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;margin:0;opacity:.95;box-shadow:0 12px 30px rgba(15,82,87,.28);rotate:1.5deg}
body.dnd,body.dnd *{user-select:none;-webkit-user-select:none;cursor:grabbing !important}
.moved{font-weight:600;font-size:13.5px;color:var(--teal);background:#e3f4f2;border-radius:999px;padding:0 9px;white-space:nowrap}
@keyframes pop{0%{box-shadow:0 0 0 3px var(--sun)}100%{box-shadow:0 1px 6px rgba(0,0,0,.06)}}
.item.justmoved{animation:pop 1.4s ease-out}
</style>
</head>

<script>
(function(){
  const COLORS={"This weekend":"#e8673c","Rehearsal dinner":"#c2577a","Alcohol":"#8e5bb5","Payments":"#2f8f4e","Welcome drinks":"#d4892a","Music":"#2d6fb5","Seating":"#1f8a8a","Decor":"#b5683a","Photos":"#5a6abf","Insurance":"#6b7a80","Texts":"#3a9d5d","Gifts":"#c9a227","Pickups & errands":"#a0522d"};
  const KEY="maWeddingActions";
  let state={};
  try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.v===DATA_VERSION)state=s.o||{};else localStorage.removeItem(KEY);}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({v:DATA_VERSION,o:state}))}catch(e){}};
  const isDone=t=>Object.prototype.hasOwnProperty.call(state,t.id)?state[t.id]:t.done;

  /* Due-date overrides from drag-and-drop: {id:{due,baseDue}}.
     Stored under their own key so they survive DATA_VERSION bumps. An override is
     dropped only when the published due date no longer equals its baseDue
     (i.e. the date was changed centrally in TASKS). */
  const DKEY="maWeddingDueOverrides";
  let moves={};
  try{const m=JSON.parse(localStorage.getItem(DKEY)||"{}");if(m&&typeof m==="object"&&!Array.isArray(m))moves=m;}catch(e){}
  function saveMoves(){try{if(Object.keys(moves).length)localStorage.setItem(DKEY,JSON.stringify(moves));else localStorage.removeItem(DKEY)}catch(e){}}
  (function prune(){
    let ch=false;
    Object.keys(moves).forEach(id=>{
      const t=TASKS.find(x=>String(x.id)===id),m=moves[id],pub=t?(t.due||""):null;
      if(!t||!m||typeof m.due!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(m.due)||m.baseDue!==pub||m.due===pub){delete moves[id];ch=true}
    });
    if(ch)saveMoves();
  })();
  const dueOf=t=>moves[t.id]?moves[t.id].due:t.due;

  // today's date in Pacific time, as YYYY-MM-DD
  function todayPT(){
    const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const g=k=>p.find(x=>x.type===k).value;return g("year")+"-"+g("month")+"-"+g("day");
  }
  const dnum=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
  const iso=n=>new Date(n*864e5).toISOString().slice(0,10);
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const fmt=s=>{const [y,m,d]=s.split("-").map(Number);const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();return DOW[w]+" "+MON[m-1]+" "+d};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const linkify=s=>esc(s).replace(/https?:\/\/[^\s)]+/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u.replace(/^https?:\/\//,"")+'</a>');

  let filter="All";
  const cats=["All"].concat([...new Set(TASKS.map(t=>t.category))]);

  function renderHeader(){
    const diff=dnum(WEDDING_DATE)-dnum(todayPT());
    document.getElementById("count").textContent= diff>1?"☀ "+diff+" days to go": diff===1?"☀ Tomorrow!": diff===0?"☀ Today's the day!":"Just married 💛";
    document.getElementById("updated").textContent=LAST_UPDATED;
  }
  function renderFilters(){
    const f=document.getElementById("filters");
    f.innerHTML=cats.map(c=>'<button class="'+(c===filter?"on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");
  }
  function renderHint(){
    const n=Object.keys(moves).length;
    document.getElementById("hint").innerHTML='<span>Drag a task (⋮⋮) to another day to move it.</span>'+
      (n?'<button class="movedbtn" data-reset-dates>↺ Reset '+n+' moved</button>':"");
  }
  function cardHTML(t,today){
    const dn=isDone(t),due=dueOf(t),mv=moves[t.id];let cls="",flag="";
    if(!dn&&due){const d=dnum(due)-today;if(d<0){cls="overdue";flag="Overdue"}else if(d<=3){cls="soon";flag=d===0?"Due today":d===1?"Due tomorrow":"Due in "+d+" days"}}
    if(dn)cls="done";
    return '<div class="item '+cls+'" data-id="'+t.id+'"><span class="grip" title="Drag to another day" aria-hidden="true">⋮⋮</span><input type="checkbox" aria-label="Mark done" data-id="'+t.id+'"'+(dn?" checked":"")+'>'+
      '<div class="body"><div class="t">'+esc(t.task)+'</div><div class="meta"><span class="pill" style="background:'+(COLORS[t.category]||"#888")+'">'+esc(t.category)+'</span>'+
      (mv?'<span class="moved" title="You moved this on this device">moved · was '+esc(mv.baseDue?fmt(mv.baseDue):"anytime")+'</span>':"")+
      (flag?'<span class="flag">'+flag+'</span>':"")+'</div>'+
      (t.note?'<div class="note">'+linkify(t.note)+'</div>':"")+
      (t.link?'<a class="lnk" href="'+esc(t.link)+'" target="_blank" rel="noopener">'+esc(t.linkText||"Open link")+' ↗</a>':"")+'</div></div>';
  }
  function render(){
    const todayS=todayPT(),today=dnum(todayS);
    const done=TASKS.filter(isDone).length;
    document.getElementById("progTxt").textContent=done+" of "+TASKS.length+" done";
    document.getElementById("progPct").textContent=Math.round(done/TASKS.length*100)+"%";
    document.getElementById("progBar").style.width=(done/TASKS.length*100)+"%";
    renderHint();

    const items=TASKS.filter(t=>filter==="All"||t.category===filter).slice().sort((a,b)=>{
      const x=dueOf(a),y=dueOf(b);
      if(x===y)return a.id-b.id; if(!x)return 1; if(!y)return -1; return x<y?-1:1;});
    // day buckets: every day from today through the wedding, plus any other day that has tasks
    const byDay={};items.forEach(t=>{const k=dueOf(t)||"anytime";(byDay[k]=byDay[k]||[]).push(t)});
    const keys=new Set(Object.keys(byDay).filter(k=>k!=="anytime"));
    for(let n=today;n<=dnum(WEDDING_DATE);n++)keys.add(iso(n));
    const order=[...keys].sort();if(byDay.anytime)order.push("anytime");
    const list=document.getElementById("list");
    list.innerHTML=order.map(k=>{
      const g=byDay[k]||[];
      if(k==="anytime")return '<section class="group"><h2 class="ghead">Anytime before wedding</h2>'+g.map(t=>cardHTML(t,today)).join("")+'</section>';
      const d=dnum(k)-today,wed=k===WEDDING_DATE;
      const label=fmt(k)+(wed?" · Wedding day 💍":d===0?" · Today":d===1?" · Tomorrow":d<0?" · Past":" · in "+d+" days");
      const hot=d<=3&&g.some(t=>!isDone(t));
      return '<section class="group'+(g.length?"":" emptyday")+(wed?" wed":"")+'" data-day="'+k+'"><h2 class="ghead'+(hot?" hot":"")+'">'+label+'</h2>'+
        (g.length?g.map(t=>cardHTML(t,today)).join(""):'<div class="dz">'+(wed?"Just get married 💛":"Nothing due · drop a task here")+'</div>')+'</section>';
    }).join("");
  }

  /* ---------- drag & drop (Pointer Events: mouse, touch, pen) ---------- */
  const list=document.getElementById("list");
  let drag=null,lastDrop=0;
  // swallow the stray click that can follow a drag
  window.addEventListener("click",e=>{if(Date.now()-lastDrop<350){e.stopPropagation();e.preventDefault()}},true);
  list.addEventListener("pointerdown",e=>{
    if(drag||(e.button!==undefined&&e.button!==0))return;
    const card=e.target.closest(".item[data-id]");if(!card)return;
    const onGrip=!!e.target.closest(".grip");
    // touch/pen: only the handle starts a drag (so the page still scrolls); mouse: whole card
    if(!onGrip&&(e.pointerType!=="mouse"||e.target.closest("input,a,button")))return;
    drag={card,id:+card.dataset.id,x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,pid:e.pointerId,started:false,over:null};
    if(onGrip){e.preventDefault();startDrag();}
  });
  window.addEventListener("pointermove",e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    if(!drag.started){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;startDrag();}
    e.preventDefault();moveDrag(e.clientX,e.clientY);
  },{passive:false});
  window.addEventListener("pointerup",e=>{if(drag&&e.pointerId===drag.pid)endDrag(true)});
  window.addEventListener("pointercancel",e=>{if(drag&&e.pointerId===drag.pid)endDrag(false)});
  window.addEventListener("keydown",e=>{if(drag&&e.key==="Escape")endDrag(false)});
  // block iOS touch scrolling while dragging
  document.addEventListener("touchmove",e=>{if(drag&&drag.started)e.preventDefault()},{passive:false});

  function startDrag(){
    drag.started=true;
    const r=drag.card.getBoundingClientRect();
    drag.dx=drag.x0-r.left;drag.dy=drag.y0-r.top;
    const g=drag.card.cloneNode(true);g.classList.add("ghost");g.classList.remove("justmoved");g.style.width=r.width+"px";
    document.body.appendChild(g);drag.ghost=g;
    drag.card.classList.add("dragsrc");document.body.classList.add("dnd");
    try{window.getSelection().removeAllRanges()}catch(_){}
    moveDrag(drag.x0,drag.y0);
    const tick=()=>{if(!drag||!drag.started)return;
      const edge=70,h=window.innerHeight;let v=0;
      if(drag.ly<edge)v=-Math.ceil((edge-drag.ly)/4);else if(drag.ly>h-edge)v=Math.ceil((drag.ly-(h-edge))/4);
      if(v){window.scrollBy(0,v);hitTest();}
      drag.raf=requestAnimationFrame(tick);};
    drag.raf=requestAnimationFrame(tick);
  }
  function moveDrag(x,y){
    drag.lx=x;drag.ly=y;
    drag.ghost.style.transform="translate("+(x-drag.dx)+"px,"+(y-drag.dy)+"px)";
    hitTest();
  }
  function hitTest(){
    const el=document.elementFromPoint(drag.lx,drag.ly);
    const sec=el&&el.closest?el.closest("#list .group[data-day]"):null;
    if(sec!==drag.over){if(drag.over)drag.over.classList.remove("over");if(sec)sec.classList.add("over");drag.over=sec;}
  }
  function endDrag(commit){
    const d=drag;drag=null;if(!d.started)return;
    lastDrop=Date.now();
    cancelAnimationFrame(d.raf);
    d.ghost.remove();d.card.classList.remove("dragsrc");document.body.classList.remove("dnd");
    if(d.over)d.over.classList.remove("over");
    if(!commit||!d.over)return;
    const day=d.over.dataset.day,t=TASKS.find(x=>x.id===d.id);
    if(!t||day===dueOf(t))return;
    if(day===(t.due||""))delete moves[t.id];else moves[t.id]={due:day,baseDue:t.due||""};
    saveMoves();render();
    const c=list.querySelector('.item[data-id="'+t.id+'"]');if(c)c.classList.add("justmoved");
  }
  function resetDates(){
    if(!Object.keys(moves).length)return;
    if(!confirm("Put all dragged tasks back on their original dates?"))return;
    moves={};saveMoves();render();
  }

  document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.c;renderFilters();render()});
  document.getElementById("hint").addEventListener("click",e=>{if(e.target.closest("[data-reset-dates]"))resetDates()});
  list.addEventListener("change",e=>{
    if(e.target.type!=="checkbox")return;const id=+e.target.dataset.id;const t=TASKS.find(x=>x.id===id);
    if(e.target.checked===t.done)delete state[id];else state[id]=e.target.checked;save();render();
  });
  document.getElementById("reset").addEventListener("click",()=>{state={};try{localStorage.removeItem(KEY)}catch(e){}render()});
  document.getElementById("resetDates").addEventListener("click",resetDates);
  renderHeader();renderFilters();render();
  setInterval(()=>{if(drag)return;renderHeader();render()},60*60*1000);
})();
</script>
</body>
</html>
